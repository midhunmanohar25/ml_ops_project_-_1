stages:
  impute_model:
    cmd: python .\src\train_inpute_model\impute_model.py .\data\processed\Cleaned_car_dataset.csv
    deps:
    - .\data\processed\Cleande_car_dataset.csv
    - .\src\train_inpute_model\impute_model.py
    outs:
    - .\data\processed\
  make_dataset:
    cmd: python .\src\data\make_dataset.py .\data\processed\cleaned_car_v2.csv
    deps:
    - .\data\processed\cleaned_car_v2.csv
    - .\src\data\make_dataset.py
    params:
    - make_dataset.test_split
    - make_dataset.seed
    outs:
    - .\data\processed\