stages:
  build_features:
    cmd: python .\src\features\build_features.py .\data\processed\Cleaned_car_dataset.csv
    deps:
    - .\data\processed\Cleande_car_dataset.csv
    - .\src\features\build_features.py
    outs:
    - .\data\processed\
  impute_model:
    cmd: python .\src\train_inpute_model\impute_model.py .\data\processed\cleaned_car_v1.csv
    deps:
    - .\data\processed\Cleande_car_dataset.csv
    - .\src\train_inpute_model\impute_model.py
    outs:
    - .\data\processed\
  make_dataset:
    cmd: python .\src\data\make_dataset.py .\data\processed\cleaned_car_v2.csv
    deps:
    - .\data\processed\cleaned_car_v2.csv
    - .\src\data\make_dataset.py
    params:
    - make_dataset.test_split
    - make_dataset.seed
    outs:
    - .\data\processed\
  train_model:
    cmd: python .\src\models\train_model.py .\data\processed\train.csv
    deps:
    - .\data\processed\train.csv
    - .\src\models\train_model.py
    params:
    - train_model.learning_rate
    - train_model.max_depth
    - train_model.min_samples_leaf
    - train_model.min_samples_split
    - train_model.n_estimators
    outs:
    - .\models\