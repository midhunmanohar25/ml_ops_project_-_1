name: CI Pipeline

on:
  push:


jobs:
  integration:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.12

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # - name: Run app and Test
    #   run: |
    #     # 1. Start the app in the background (&)
    #     python app.py & 
        
    #     # 2. Wait for the server to boot up
    #     sleep 5 
        
    #     # 3. Test if the app is alive (Health Check)
    #     curl --fail http://127.0.0.1:8000 || exit 1
        
    #     # 4. Kill the background process so the CI can finish
    #     pkill python
    - name: Run FastAPI and Test
      env:
        MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
        MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        MODEL_NAME: "Car_Price_Pipeline"
        MODEL_VERSION: "1"
      run: |
        # 1. Start ONLY FastAPI in the background (pointing to your Website folder)
        uvicorn Website.FastAPI_code:app --host 0.0.0.0 --port 8000 &
        
        # 2. Wait for FastAPI to pull the model from MLflow and boot up
        sleep 10 
        
        # 3. Send a test prediction payload via curl to verify it works
        curl --fail -X POST http://127.0.0.1:8000/predict \
          -H "Content-Type: application/json" \
          -d '{"car_age": 5, "is_luxury": true, "kms_per_year": 12000.5}' || exit 1
        
        # 4. Kill the process so CI can finish
        pkill uvicorn


  run-using-docker:
      name: Docker CI
      needs: integration
      runs-on: ubuntu-latest
      

      steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
          
        - name: Login to Docker Hub
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PASSWORD }}

        - name: Build and Push
          uses: docker/build-push-action@v5
          with:
            push: true
            tags: midhun256/carpred:latest

    
