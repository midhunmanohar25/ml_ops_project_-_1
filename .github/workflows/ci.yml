name: CI Pipeline

on:
  push:

# env:
#   # Opt into Node.js 24 now to clear the deprecation warning
#   FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.12

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run app and Test
      run: |
        # 1. Start the app in the background (&)
        python app.py & 
        
        # 2. Wait for the server to boot up
        sleep 5 
        
        # 3. Test if the app is alive (Health Check)
        curl --fail http://127.0.0.1:8000 || exit 1
        
        # 4. Kill the background process so the CI can finish
        pkill python