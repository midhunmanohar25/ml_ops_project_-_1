name: car-price-app  # 1. FIXED: Overrides the folder name with a clean name to stop the invalid reference error!

services:
  # FastAPI Backend Container
  fastapi-backend:
    image: midhun256/carpred:latest  # 2. Double-check that this line is exactly here and saved!
    container_name: fastapi_backend_container
    ports:
      - "8000:8000"
    environment:
      - MLFLOW_TRACKING_URI=https://dagshub.com/midhunmanohar25/ml_ops_project_-_1.mlflow
      - MLFLOW_TRACKING_USERNAME=midhunmanohar25
      - MLFLOW_TRACKING_PASSWORD=your_actual_dagshub_token_here  # <-- Make sure your real token is here
      - MODEL_NAME=Car_Price_Pipeline
      - MODEL_VERSION=1
    command: uvicorn Website.FastAPI_code:app --host 0.0.0.0 --port 8000

  # Streamlit Frontend Container
  streamlit-frontend:
    image: midhun256/carpred:latest
    container_name: streamlit_frontend_container
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://fastapi-backend:8000/predict
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0
    depends_on:
      - fastapi-backend